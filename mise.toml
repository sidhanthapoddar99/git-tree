[tools]
node = "24"
# Build the engine for Linux against glibc 2.28, the oldest glibc Visual Studio Code supports
zig = "0.17.0"
"cargo:cargo-zigbuild" = "0.24.0"

[tasks.setup]
description = "Install the npm dependencies, and build the demo repository."
run = ["npm ci", "scripts/make-demo-repo.sh --if-missing"]

[tasks.build]
description = "Lint, then build the extension (out/) and the webview (media/)."
run = "npm run compile"

[tasks.test]
description = "Run the Jest tests."
run = "npx jest"

[tasks.engine]
description = "Build the Rust engine in release mode, into native/bin/."
run = "npm run build-engine"

[tasks.test-engine]
description = "Compare each engine read with the Git CLI read, on real repositories (needs the engine built)."
run = "npm run test-engine"

[tasks.bench-engine]
description = "Time each read with the Git CLI and with the engine: mise run bench-engine <repository>."
run = "npm run bench-engine --"

[tasks.gate]
description = "Lint, build and test: run it before a release."
depends = ["build"]
run = "npx jest"

[tasks.demo]
description = "Rebuild the demo repository in dev-workspace/ from scratch."
run = "scripts/make-demo-repo.sh --force"

[tasks.package]
description = "Build the engine for all eight platforms, and package the extension into dist/git-tree-rs-<version>.vsix."
run = ["npx tsc -p ./src", "node scripts/build-engine.js --all", "npx --yes @vscode/vsce package --out dist/"]

[tasks.install]
description = "Package the extension, and install it in Visual Studio Code."
depends = ["package"]
run = "code --install-extension dist/git-tree-rs-$(node -p \"require('./package.json').version\").vsix --force"

[tasks.screenshots]
description = "Convert the PNG screenshots in docs/images/ to WebP."
run = "scripts/convert-screenshots.sh"
